name: Build and release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - id: plan
        run: python packaging/github_release.py plan
        env:
          GH_TOKEN: ${{ github.token }}

  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            target: windows-x64
          - runner: macos-15-intel
            target: macos-x64
          - runner: macos-15
            target: macos-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packaging/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r packaging/requirements.txt
      - name: Install source
        run: python -m pip install --no-deps -e .
      - name: Python tests
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Build and verify packages
        run: python packaging/package.py
      - name: Verify delivered installer and portable archive
        run: python packaging/verify_artifacts.py dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EUI-PySide6-${{ matrix.target }}-${{ github.sha }}
          if-no-files-found: error
          compression-level: 0
          path: |
            dist/EUI-PySide6-Gallery-*
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
      - name: Rendering regression checks
        run: python tests/run_all.py --match popup_spinbox_rendering --jobs 1
      - name: QML tests
        run: python tests/run_all.py --jobs 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: logs-${{ matrix.target }}-${{ github.sha }}
          path: |
            test-results/*.json
            test-results/*.txt
            build/pyinstaller/**/warn-*.txt

  library:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install build==1.3.0
      - run: python -m build
      - name: Library checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          files = sorted(path for path in Path('dist').iterdir() if path.suffix in ('.whl', '.gz'))
          assert len(files) == 2
          Path('dist/SHA256SUMS.txt').write_text(''.join(hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n' for path in files), encoding='ascii')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: EUI-PySide6-library-${{ github.sha }}
          if-no-files-found: error
          path: dist/*

  release:
    needs: [plan, desktop, library]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      EUI_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: EUI-PySide6-*-${{ github.sha }}
          path: dist
      - run: python packaging/github_release.py collect
      - run: python packaging/github_release.py publish
