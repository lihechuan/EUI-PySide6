[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "EUI-PySide6"
version = "1.3.2"
description = "EUI Qt Quick / QML component library and Gallery for Python desktop applications using PySide6"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
dependencies = ["PySide6>=6.8,<7", "Pillow>=10", "qrcode>=8.2,<9"]

[project.urls]
Homepage = "http://easy-ui.cn/"
Repository = "https://github.com/lihechuan/EUI-PySide6"
Issues = "https://github.com/lihechuan/EUI-PySide6/issues"
Documentation = "https://github.com/lihechuan/EUI-PySide6/blob/master/docs/guide.en.md"

[project.gui-scripts]
eui-gallery = "eui_gallery.src.main:main"

[tool.setuptools]
packages = ["eui", "eui.component", "eui.config", "eui.enum", "eui.layout", "eui.state", "eui.style", "eui.style.palettes", "eui.utils", "eui_gallery", "eui_gallery.src"]
package-dir = {eui = "source", eui_gallery = "example"}

[tool.setuptools.package-data]
eui = ["data/*.json", "qml/**/*", "shaders/*", "thirdparty/**/*", "resources.qrc", "resources.rcc"]
eui_gallery = ["qml/**/*", "data/*", "quick3d/**/*", "assets/**/*", "example.qrc", "example.rcc"]
